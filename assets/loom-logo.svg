<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" fill="none" role="img" aria-label="Loom">
  <title>Loom</title>
  <defs>
    <linearGradient id="loomBg" x1="0" y1="0" x2="96" y2="96" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>

  <!-- 渐变圆角方形背景 -->
  <rect width="96" height="96" rx="22" fill="url(#loomBg)"/>

  <!-- 纬线：在竖线处断开，表现从经线后面穿过 -->
  <g stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" opacity="0.55">
    <path d="M22 34 H29"/>
    <path d="M35 34 H74"/>
    <path d="M22 58 H29"/>
    <path d="M35 58 H74"/>
  </g>

  <!-- 主体 L：竖线 + 横线，转角圆润 -->
  <path d="M32 22 V74 H74"
        stroke="#ffffff"
        stroke-width="6"
        stroke-linecap="round"
        stroke-linejoin="round"/>

  <!-- 转角圆点：强调“线”与“结”的交织 -->
  <circle cx="32" cy="74" r="3" fill="#ffffff"/>
</svg>